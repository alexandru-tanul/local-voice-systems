name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # For the tests that cut a real recording into clips.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q -l . tests scripts
      - if: runner.os == 'Linux'
        run: bash -n scripts/setup_engine.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in 'Launch-Voice-Dashboard.ps1', 'Stop-Voice-Dashboard.ps1') {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/$script", [ref]$null, [ref]$parseErrors) > $null
            if ($parseErrors) { throw "${script}: $($parseErrors | Out-String)" }
          }
