name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q voice_dashboard.py voice_hardware.py relay_asr_server.py
      - if: runner.os == 'Linux'
        run: bash -n setup_voice_engine.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/Launch-Voice-Dashboard.ps1", [ref]$null, [ref]$parseErrors) > $null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
